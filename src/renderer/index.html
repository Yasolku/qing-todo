<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>轻待办</title>
    <link href="styles.css" rel="stylesheet">
    <style>
        /* Custom styles for glass effect and scrollbar */
        .glass-light {
            background: rgba(240, 248, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-dark {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .drag-region {
            -webkit-app-region: drag;
        }
        
        .no-drag {
            -webkit-app-region: no-drag;
        }
        
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 3px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
        
        /* Animation classes */
        .slide-in {
            animation: slideIn 0.2s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-out {
            animation: fadeOut 0.2s ease-in;
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }
        
        /* Task completion animation */
        .task-complete {
            animation: taskComplete 0.3s ease-in-out;
        }
        
        @keyframes taskComplete {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        /* Fallback classes for Solo Leveling theme if Tailwind CLI misses them */
        .from-blue-600 { --tw-gradient-from: #2563eb; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
        .to-purple-600 { --tw-gradient-to: #9333ea; }
        .dark\:from-blue-400 { --tw-gradient-from: #60a5fa; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
        .dark\:to-purple-400 { --tw-gradient-to: #c084fc; }
        .from-blue-500 { --tw-gradient-from: #3b82f6; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
        .to-purple-500 { --tw-gradient-to: #a855f7; }
        .text-blue-500 { color: #3b82f6; }
        .bg-blue-500\/20 { background-color: rgba(59, 130, 246, 0.2); }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .text-transparent { color: transparent; }

        /* Fixed compact surface that does not depend on image or DPI scaling. */
        .compact-bar {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 84px;
            box-sizing: border-box;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border: 0;
            color: #e5e7eb;
            background: #0f172a;
            cursor: pointer;
            z-index: 1000;
            -webkit-app-region: drag;
        }
        .compact-bar.visible { display: flex; }
        .compact-bar__brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .compact-bar__check {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            flex: 0 0 30px;
            border-radius: 10px;
            color: white;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            font-size: 18px;
            font-weight: 700;
        }
        .compact-bar__task {
            min-width: 0;
            overflow: hidden;
            color: #f8fafc;
            font-size: 18px;
            font-weight: 800;
            line-height: 1.25;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .compact-bar__time { color: #a78bfa; font-size: 13px; font-weight: 700; white-space: nowrap; }
        .compact-bar__expand {
            padding: 7px 10px;
            border-radius: 9px;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            white-space: nowrap;
            border: 0;
            cursor: pointer;
            -webkit-app-region: no-drag;
        }

        .day-filter {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 16px 10px;
            flex: 0 0 auto;
            -webkit-app-region: no-drag;
        }
        .day-filter button {
            height: 30px;
            padding: 0 9px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 9px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }
        .day-filter button:hover { color: #e2e8f0; background: rgba(255, 255, 255, 0.1); }
        .day-filter__label { flex: 1; color: #c4b5fd !important; font-weight: 700; }
        .day-filter__all.active { color: white; background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
        #tasksList { contain: layout paint; will-change: scroll-position; overscroll-behavior: contain; }
    </style>
</head>
<body class="m-0 p-0 overflow-hidden select-none font-sans text-gray-800 dark:text-gray-100 bg-transparent">
    <!-- Main Container with Premium Glass Effect -->
    <div id="app" class="w-full h-screen flex flex-col rounded-2xl overflow-hidden transition-all duration-300 relative group">
        <div id="compactBar" class="compact-bar" title="拖动以移动窗口">
            <span class="compact-bar__brand">
                <span class="compact-bar__check">✓</span>
                <span id="compactTask" class="compact-bar__task">今日无待办</span>
            </span>
            <span id="compactTime" class="compact-bar__time">00:00</span>
            <button id="compactExpandBtn" type="button" class="compact-bar__expand">展开</button>
        </div>
        
        <!-- Gradient Border/Glow Container -->
        <div class="absolute inset-0 bg-gradient-to-br from-blue-500/20 to-purple-500/20 pointer-events-none opacity-50"></div>
        
        <!-- Background Layer -->
        <div class="absolute inset-0 glass-bg z-0 transition-colors duration-300 bg-white/80 dark:bg-gray-900/80"></div>

        <!-- Content Layer -->
        <div class="relative z-10 flex flex-col h-full">
            
            <!-- Title Bar -->
            <div id="titleBar" class="drag-region flex items-center justify-between p-4 pb-2 min-h-[64px] relative z-30">
                <div class="flex items-center space-x-3 group/brand">
                    <div class="relative">
                        <div class="relative w-10 h-10 group-hover/brand:scale-110 transition-transform duration-300 flex items-center justify-center">
                            <img src="../../assets/icon-png.png" class="w-full h-full object-contain scale-[1.3] drop-shadow-md" alt="flost8 logo">
                        </div>
                    </div>
                    <div id="brandTextContainer" class="min-w-[80px] cursor-pointer no-drag group/text" title="切换紧凑模式">
                        <h1 id="brandTitle" class="text-base font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400 transition-all duration-300">轻待办</h1>
                    </div>
                </div>

                <!-- Window Controls -->
                <div class="no-drag flex items-center space-x-2 bg-black/5 dark:bg-white/5 rounded-lg p-1 transition-opacity opacity-0 group-hover:opacity-100">
                    <button id="alwaysOnTopBtn" class="p-1.5 rounded-md hover:bg-black/5 dark:hover:bg-white/10 transition-all active:scale-95" title="置顶窗口">
                        <svg class="w-3.5 h-3.5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <line x1="12" y1="17" x2="12" y2="22" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></line>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
                        </svg>
                    </button>
                    <button id="themeBtn" class="p-1.5 rounded-md hover:bg-black/5 dark:hover:bg-white/10 transition-all active:scale-95" title="切换明暗主题">
                         <svg class="w-3.5 h-3.5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                    <div class="w-px h-3 bg-gray-300 dark:bg-gray-700"></div>
                    <button id="closeBtn" class="p-1.5 rounded-md hover:bg-red-500 hover:text-white transition-all active:scale-95 text-red-400">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Main Content Area -->
            <div id="mainContentArea" class="flex-1 flex flex-col overflow-hidden transition-opacity duration-300">
                <div class="day-filter" aria-label="日期筛选">
                    <button id="prevDayBtn" type="button" title="上一天">‹</button>
                    <button id="todayBtn" type="button" class="day-filter__label" title="回到今天">今天</button>
                    <button id="nextDayBtn" type="button" title="下一天">›</button>
                    <button id="allDaysBtn" type="button" class="day-filter__all" title="显示全部日期">全部</button>
                </div>
                <!-- Tasks List -->
                <div class="flex-1 no-drag px-4 pb-2 overflow-hidden relative">
                <!-- Top fade for smooth scrolling -->
                <div class="absolute top-0 left-0 right-0 h-4 bg-gradient-to-b from-white/80 to-transparent dark:from-gray-900/80 z-10 pointer-events-none"></div>
                
                <div id="tasksList" class="h-full overflow-y-auto custom-scrollbar space-y-2.5 pt-2 pb-20">
                    <!-- Tasks will be dynamically inserted here -->
                </div>
                
                <!-- Bottom fade -->
                <div class="absolute bottom-0 left-0 right-0 h-12 bg-gradient-to-t from-white/90 to-transparent dark:from-gray-900/90 z-10 pointer-events-none"></div>

                <!-- Empty state -->
                <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center p-8 text-center">
                    <div class="w-20 h-20 rounded-full bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-800/50 flex items-center justify-center mb-4 shadow-inner">
                        <svg class="w-8 h-8 text-gray-400 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                    </div>
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">今天都完成啦！</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">去放松一下，或者添加一件真正重要的事。</p>
                </div>
            </div>
            
            <!-- Add Task & Footer (Floating) -->
            <div class="no-drag absolute bottom-0 left-0 right-0 p-4 z-20">
                 <div class="relative group/input">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-purple-500 rounded-xl opacity-30 group-focus-within/input:opacity-100 transition-opacity duration-300 blur-[2px]"></div>
                    <div class="relative flex items-center bg-white dark:bg-gray-800 rounded-xl shadow-xl overflow-hidden">
                        <input 
                            id="taskInput" 
                            type="text" 
                            maxlength="300"
                            placeholder="写下一件想做的事……"
                            class="w-full px-4 py-3 bg-transparent text-sm text-gray-800 dark:text-gray-100 placeholder-gray-400 focus:outline-none"
                        >
                        <button id="addBtn" class="p-2 mr-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-500 hover:text-white hover:bg-gradient-to-r hover:from-blue-500 hover:to-purple-500 transition-all duration-300">
                             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                             </svg>
                        </button>
                    </div>
                 </div>
                 
                 <div class="flex justify-between items-center mt-2 px-2">
                     <span id="taskCount" class="text-[10px] font-medium text-gray-400 dark:text-gray-500 tracking-wide">暂无待办</span>
                     <div class="flex items-center space-x-3">
                         <button id="clearCompletedBtn" class="hidden text-[10px] font-medium text-gray-400 hover:text-red-400 transition-colors tracking-wide">清除已完成</button>
                         <span class="resize-handle cursor-nw-resize text-gray-300 dark:text-gray-600 hover:text-gray-500">
                             <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><path d="M8 8H0V6H2V4H4V2H6V0H8V8Z"/></svg>
                         </span>
                     </div>
                 </div>
            </div>
                 </div>
            </div>
        </div>
    </div>

        <script type="module" src="app.js"></script>
</body>
</html>
